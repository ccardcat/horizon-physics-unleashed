name: Atomic Age native diagnostic
on:
  push:
    branches: [atomic-age/native-debug]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon-mixins
          ref: 5a64af938ec86b00d53d16a408aabc0038fb3e57
          path: mixins-tool
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mixins-tool -> target
          cache-on-failure: true
      - name: Apply the pinned native bundle
        run: |
          cargo build --locked --manifest-path mixins-tool/Cargo.toml -p horizon-mixins-cli
          python mods/official/atomic-age-native/tools/assemble.py
          python - <<'PY'
          from pathlib import Path
          p=Path('engine/CLAUDE.md')
          if p.is_symlink():
              text=p.read_text();p.unlink();p.write_text(text)
          PY
          mixins-tool/target/debug/horizon-mixins apply --workspace engine --mods mods/official/atomic-age-native/mixins --out staged
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: staged -> target
          shared-key: atomic-age-native-engine-linux
          cache-on-failure: true
      - name: Report native validation details
        run: |
          python - <<'PYTHON'
          import subprocess,sys,re
          commands=[['cargo','check','--locked','--manifest-path','staged/Cargo.toml','-p','horizon-client','--lib','--no-default-features'],['cargo','test','--locked','--manifest-path','staged/Cargo.toml','-p','horizon-client-render','--lib','--no-default-features','gfx::atomic_age','--','--nocapture']]
          for args in commands:
              p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              print(p.stdout,flush=True)
              if p.returncode:
                  clean=re.sub(r'\x1b\[[0-9;]*m','',p.stdout)
                  lines=[line for line in clean.splitlines() if re.search('error|failed|Caused|panic|signal|killed|undefined|process',line,re.I)]
                  report='\n'.join(line[:800]+' ... '+line[-300:] if len(line)>1200 else line for line in lines)+'\nFINAL: '+clean[-1500:]
                  for i in range(0,len(report),2400):
                      chunk=report[i:i+2400].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print('::error title=Native diagnostic '+str(i)+'::'+chunk,flush=True)
                  sys.exit(p.returncode)
          PYTHON
