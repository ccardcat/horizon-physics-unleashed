name: PHYSICS UNLEASHED
on:
  workflow_dispatch:
  push:
    branches: [main, 'physics-unleashed/**']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/physics-core/**'
      - 'crates/horizon-client/**'
      - 'crates/horizon-core/**'
      - 'crates/horizon-world/**'
      - 'crates/horizon-protocol/**'
      - '.github/workflows/physics-unleashed.yml'
      - 'docs/physics-unleashed.md'
      - 'docs/physics-visual.md'
      - 'tools/physics_visual_smoke.py'
      - 'packaging/physics-windows/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/physics-core/**'
      - 'crates/horizon-client/**'
      - 'crates/horizon-core/**'
      - 'crates/horizon-world/**'
      - 'crates/horizon-protocol/**'
      - '.github/workflows/physics-unleashed.yml'
      - 'docs/physics-unleashed.md'
      - 'docs/physics-visual.md'
      - 'tools/physics_visual_smoke.py'
      - 'packaging/physics-windows/**'
permissions:
  contents: read
concurrency:
  group: physics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: physics-unleashed
      - name: Format and public tree
        run: |
          cargo +stable fmt --all -- --check
          python3 tools/check_public_tree.py
      - name: Physics core
        run: |
          cargo +stable clippy --locked -p physics-core --all-targets -- -D warnings
          cargo +stable test --locked -p physics-core
          cargo +stable clippy --locked -p horizon-protocol --lib -- -D warnings
          cargo +stable test --locked -p horizon-protocol --lib
      - name: Horizon integration and feature-disabled compilation
        run: |
          cargo +stable check --locked -p horizon-client --no-default-features --lib --bins
          cargo +stable clippy --locked -p horizon-client --no-default-features --features physics-unleashed --lib --bins --test physics_dimension --test physics_visual -- -D warnings
          cargo +stable test --locked -p horizon-client --no-default-features --features physics-unleashed --test physics_dimension --test physics_visual
          python3 -m py_compile tools/physics_visual_smoke.py
      - name: Build CPU-testable artifacts
        run: |
          cargo +stable build --locked -p horizon-client --no-default-features --features physics-unleashed --bins
          cargo +stable run --locked -p physics-core --example falling_cube > falling-cube.csv
          mkdir -p physics-artifacts
          cp target/debug/horizon-client target/debug/horizon-ctl target/debug/examples/falling_cube falling-cube.csv physics-artifacts/
          cp docs/physics-visual.md physics-artifacts/README.md
          cargo +stable test --locked -p horizon-client --no-default-features --features physics-unleashed --test physics_dimension --test physics_visual --no-run --message-format=json > physics-test-build.json
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          executables = {row['target']['name']: row['executable'] for line in Path('physics-test-build.json').read_text().splitlines()
                         if (row := json.loads(line)).get('reason') == 'compiler-artifact'
                         and row['target']['name'] in ('physics_dimension', 'physics_visual') and row.get('executable')}
          assert len(executables) == 2, executables
          for name, executable in executables.items():
              shutil.copy2(executable, 'physics-artifacts/' + name)
          PY
          git rev-parse HEAD > physics-artifacts/COMMIT
          cd physics-artifacts
          sha256sum horizon-client horizon-ctl falling_cube physics_dimension physics_visual falling-cube.csv README.md COMMIT > SHA256SUMS
          tar -czf ../physics-unleashed-linux.tar.gz .
      - name: Upload verified Linux development binaries (no Minecraft assets)
        uses: actions/upload-artifact@v6
        with:
          name: physics-unleashed-linux-${{ github.sha }}
          path: physics-unleashed-linux.tar.gz
          if-no-files-found: error
          retention-days: 7
  windows:
    name: Windows x64 EXE
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_FAST_DEBUG: '0'
      CARGO_PROFILE_FAST_OPT_LEVEL: '1'
      CARGO_PROFILE_FAST_INCREMENTAL: 'false'
      # Match Horizon's portable Windows builds: no VC++ redistributable needed.
      RUSTFLAGS: '-C target-feature=+crt-static'
      HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
      HORIZON_NO_AUDIO: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: physics-unleashed-windows
      - name: Isolate runtime checks from player data
        run: |
          $physicsScratch = Join-Path $env:RUNNER_TEMP ('physics-' + [guid]::NewGuid().ToString())
          foreach ($variable in @('HORIZON_HOME','HORIZON_LAUNCHER_HOME','XDG_DATA_HOME','XDG_CONFIG_HOME','HORIZON_LAUNCHER_TRASH','HORIZON_LAUNCHER_CLIPBOARD','HORIZON_LAUNCHER_DESKTOP')) {
            $directory = Join-Path $physicsScratch $variable
            New-Item -ItemType Directory -Force $directory | Out-Null
            "$variable=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Native Windows physics tests
        run: |
          cargo +stable test --locked -p physics-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --locked -p horizon-protocol --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --locked -p horizon-client --features physics-unleashed --test physics_dimension --test physics_visual
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build optimized Windows client and control EXEs (audio and controllers enabled)
        run: |
          cargo +stable build --locked --profile fast -p horizon-client --features physics-unleashed --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_imports.py target/fast/horizon-client.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_imports.py target/fast/horizon-ctl.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/fast/horizon-client.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/fast/horizon-ctl.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable Windows folder
        run: |
          New-Item -ItemType Directory -Force windows-artifacts | Out-Null
          Copy-Item target/fast/horizon-client.exe,target/fast/horizon-ctl.exe windows-artifacts/
          Copy-Item research-lock.json windows-artifacts/
          Copy-Item packaging/physics-windows/Start-Physics-Unleashed.cmd,packaging/physics-windows/README-WINDOWS.txt windows-artifacts/
          git rev-parse HEAD | Set-Content -Encoding utf8 windows-artifacts/COMMIT.txt
          $files = Get-ChildItem windows-artifacts -File
          $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding utf8 windows-artifacts/SHA256SUMS.txt
      - name: Upload Windows EXEs (download ZIP, extract, open Start-Physics-Unleashed.cmd)
        uses: actions/upload-artifact@v6
        with:
          name: PHYSICS-UNLEASHED-Windows-x64
          path: windows-artifacts/
          if-no-files-found: error
          retention-days: 14
